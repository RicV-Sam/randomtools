<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
let spinning = false;
let currentAngle = 0;

function getSegments() {
  const mode = document.getElementById('mode').value;
  if (mode === 'yesno') return [
    {label:'YES', color:'#4ade80', textColor:'#052e16', size: 0.5},
    {label:'NO', color:'#f87171', textColor:'#450a0a', size: 0.5}
  ];
  if (mode === 'yesnomaybe') return [
    {label:'YES', color:'#4ade80', textColor:'#052e16', size: 1/3},
    {label:'NO', color:'#f87171', textColor:'#450a0a', size: 1/3},
    {label:'MAYBE', color:'#facc15', textColor:'#422006', size: 1/3}
  ];
  if (mode === 'heavy-yes') return [
    {label:'YES', color:'#4ade80', textColor:'#052e16', size: 0.7},
    {label:'NO', color:'#f87171', textColor:'#450a0a', size: 0.3}
  ];
  return [
    {label:'YES', color:'#4ade80', textColor:'#052e16', size: 0.3},
    {label:'NO', color:'#f87171', textColor:'#450a0a', size: 0.7}
  ];
}

function drawWheel(angle = 0) {
  const segs = getSegments();
  const cx = 150, cy = 150, r = 140;
  ctx.clearRect(0,0,300,300);
  let start = angle;
  segs.forEach(seg => {
    const arc = seg.size * 2 * Math.PI;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, start + arc);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();
    ctx.strokeStyle = '#0a0a0f';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + arc / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = seg.textColor;
    ctx.font = 'bold 22px Space Mono, monospace';
    ctx.fillText(seg.label, r - 20, 8);
    ctx.restore();
    start += arc;
  });

  // center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 18, 0, 2 * Math.PI);
  ctx.fillStyle = '#0a0a0f';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function spin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('answer').textContent = '...';
  document.getElementById('subtext').textContent = '';

  const totalSpins = (5 + Math.random() * 5) * 2 * Math.PI;
  const duration = 2500 + Math.random() * 1000;
  const startAngle = currentAngle;
  const targetAngle = startAngle + totalSpins;
  const startTime = performance.now();

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  function frame(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    currentAngle = startAngle + (targetAngle - startAngle) * easeOut(progress);
    drawWheel(currentAngle);

    if (progress < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      // Find winning segment: pointer at top = -PI/2, find which segment contains that
      const segs = getSegments();
      const normalised = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const pointerAngle = (2 * Math.PI - normalised) % (2 * Math.PI);
      let cumulative = 0;
      let winner = segs[0];
      for (const seg of segs) {
        cumulative += seg.size * 2 * Math.PI;
        if (pointerAngle < cumulative) { winner = seg; break; }
      }
      const answerEl = document.getElementById('answer');
      answerEl.textContent = winner.label;
      answerEl.style.color = winner.color;
      document.getElementById('subtext').textContent = 'Spin again to try your luck';
    }
  }
  requestAnimationFrame(frame);
}

drawWheel();
</script>
