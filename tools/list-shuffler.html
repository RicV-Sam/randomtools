<style>
.output-list { display:flex;flex-direction:column;gap:6px;margin-top:1.25rem; }
.list-item {
  display:flex;align-items:center;gap:10px;
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;animation:slideIn 0.2s ease both;
}
@keyframes slideIn {
  from { transform:translateX(-10px);opacity:0; }
  to   { transform:translateX(0);opacity:1; }
}
.item-num { font-family:var(--mono);font-size:11px;color:var(--text3);min-width:20px; }
.item-text { font-size:14px;color:var(--text);flex:1; }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-back" href="../index.html">← all tools</a>
  <div class="nav-logo">random<span>tools</span></div>
</nav>

<main class="tool-page">

  <div class="tool-header">
    <div class="tool-icon">🔀</div>
    <h1>List Shuffler</h1>
    <p>Paste any list — get it back in a random order</p>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Your list (one item per line)</label>
      <textarea id="listInput" style="min-height:140px;" placeholder="Monday&#10;Tuesday&#10;Wednesday&#10;Thursday&#10;Friday&#10;Saturday&#10;Sunday"></textarea>
    </div>
    <div class="control-row">
      <div class="control-group">
        <label>Pick top N items</label>
        <input type="number" id="topN" value="" placeholder="All" min="1">
      </div>
      <div class="control-group">
        <label>Show numbering</label>
        <select id="showNums">
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
    </div>
  </div>

  <button class="btn-generate" onclick="shuffle()">SHUFFLE LIST</button>
  <button class="btn-copy" id="copyBtn" onclick="copyList()" style="margin-top:8px;">Copy shuffled list</button>

  <div class="output-list" id="output"></div>

  <div class="related" style="margin-top:2rem;">
    <div class="related-label">Related tools</div>
    <div class="related-grid">
      <a class="related-card" href="team-picker.html"><span class="ri">👥</span> Team Picker</a>
      <a class="related-card" href="random-number.html"><span class="ri">🎲</span> Random Number</a>

      <a class="related-card" href="lottery-picker.html"><span class="ri">🍀</span> Lottery Picker</a>
    </div>
  </div>

</main>

<footer><p>RandomTools &copy; 2025 — <a href="../index.html">all tools</a></p></footer>

<script>
let shuffledItems = [];

function shuffle() {
  const raw = document.getElementById('listInput').value.trim();
  if (!raw) { alert('Please enter a list first'); return; }
  const items = raw.split('\n').map(i => i.trim()).filter(i => i);
  
  // Fisher-Yates shuffle
  const arr = [...items];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }

  const topN = parseInt(document.getElementById('topN').value);
  shuffledItems = isNaN(topN) ? arr : arr.slice(0, topN);
  const showNums = document.getElementById('showNums').value === 'yes';

  const out = document.getElementById('output');
  out.innerHTML = shuffledItems.map((item, i) => `
    <div class="list-item" style="animation-delay:${i * 40}ms">
      ${showNums ? `<span class="item-num">${i+1}.</span>` : ''}
      <span class="item-text">${escapeHtml(item)}</span>
    </div>
  `).join('');

  out.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function copyList() {
  if (!shuffledItems.length) return;
  const text = shuffledItems.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy shuffled list'; btn.classList.remove('copied'); }, 2000);
  });
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
