canvas#wonCanvas {

<script>
const STORAGE_KEY = 'won-names';
const COLORS = [
  {bg:'#7c6af7',fg:'#fff'},{bg:'#a78bfa',fg:'#fff'},
  {bg:'#34d399',fg:'#052e16'},{bg:'#fb923c',fg:'#1c0a00'},
  {bg:'#f472b6',fg:'#1c0011'},{bg:'#60a5fa',fg:'#001c3a'},
  {bg:'#facc15',fg:'#422006'},{bg:'#f87171',fg:'#1c0000'},
  {bg:'#4ade80',fg:'#001c00'},{bg:'#38bdf8',fg:'#001c2a'},
  {bg:'#fb7185',fg:'#1c0008'},{bg:'#a3e635',fg:'#0a1c00'},
];

const canvas = document.getElementById('wonCanvas');
const ctx = canvas.getContext('2d');
let names = [];
let spinning = false;
let currentAngle = 0;

function load() {
  try { names = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { names = []; }
  if (!names.length) names = ['Alice','Bob','Charlie','Diana','Eve','Frank','Grace','Hank'];
  renderChips();
  drawWheel(currentAngle);
}

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(names)); }

function addNames() {
  const raw = document.getElementById('nameInput').value;
  const added = raw.split('\n').map(n => n.trim()).filter(n => n && n.length <= 40);
  if (!added.length) return;
  names = [...names, ...added].slice(0, 60); // cap at 60
  document.getElementById('nameInput').value = '';
  save();
  renderChips();
  drawWheel(currentAngle);
}

function removeName(i) {
  names.splice(i, 1);
  save();
  renderChips();
  drawWheel(currentAngle);
}

function clearAll() {
  if (!confirm('Remove all names?')) return;
  names = [];
  save();
  renderChips();
  drawWheel(currentAngle);
  document.getElementById('winnerDisplay').textContent = '—';
  document.getElementById('winnerSub').textContent = 'Add names to get started';
}

function renderChips() {
  const container = document.getElementById('namesChips');
  const count = document.getElementById('namesCount');
  count.textContent = names.length ? `${names.length} name${names.length !== 1 ? 's' : ''} on the wheel` : 'No names added yet';
  container.innerHTML = names.map((n, i) => `
    <span class="name-chip">
      <span style="color:${COLORS[i % COLORS.length].bg};font-size:10px;">●</span>
      ${escHtml(n)}
      <button class="chip-remove" onclick="removeName(${i})" title="Remove">✕</button>
    </span>`).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function drawWheel(angle) {
  const n = names.length;
  const W = canvas.width;
  const cx = W / 2, cy = W / 2, r = W / 2 - 4;
  ctx.clearRect(0, 0, W, W);

  if (!n) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.fillStyle = '#1c1c26';
    ctx.fill();
    ctx.fillStyle = '#5a5a72';
    ctx.font = '14px DM Sans, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Add names above', cx, cy);
    return;
  }

  const arc = (2 * Math.PI) / n;
  for (let i = 0; i < n; i++) {
    const start = angle + i * arc;
    const end = start + arc;
    const col = COLORS[i % COLORS.length];

    // segment
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = col.bg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(10,10,15,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // label
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + arc / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = col.fg;
    const fontSize = n <= 8 ? 14 : n <= 20 ? 11 : 9;
    ctx.font = `bold ${fontSize}px Space Mono, monospace`;
    const maxLen = r - 18;
    let label = names[i];
    // truncate if too long
    while (ctx.measureText(label).width > maxLen - 10 && label.length > 1) {
      label = label.slice(0, -1);
    }
    if (label !== names[i]) label += '…';
    ctx.fillText(label, r - 10, fontSize / 3);
    ctx.restore();
  }

  // center hub
  ctx.beginPath();
  ctx.arc(cx, cy, 16, 0, 2 * Math.PI);
  ctx.fillStyle = '#0a0a0f';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function getWinner() {
  const n = names.length;
  const arc = (2 * Math.PI) / n;
  // pointer at top means angle from 12 o'clock = -PI/2 in canvas coords
  // canvas starts at 3 o'clock (0) going clockwise
  // Our angle offset: the segment at top is the one where -PI/2 falls
  const normalised = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  // pointer is at top = angle = 3*PI/2 in non-rotated system
  const pointerAt = ((3 * Math.PI / 2 - normalised) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
  return names[Math.floor(pointerAt / arc) % n];
}

function spin() {
  if (spinning || !names.length) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('winnerDisplay').textContent = '…';
  document.getElementById('winnerDisplay').style.color = 'var(--text2)';
  document.getElementById('winnerSub').textContent = '';

  const totalRot = (6 + Math.random() * 6) * 2 * Math.PI;
  const duration = 3000 + Math.random() * 1500;
  const startAngle = currentAngle;
  const targetAngle = startAngle + totalRot;
  const startTime = performance.now();

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  function frame(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    currentAngle = startAngle + (targetAngle - startAngle) * easeOut(t);
    drawWheel(currentAngle);
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      const winner = getWinner();
      const winIdx = names.indexOf(winner);
      const winColor = COLORS[winIdx % COLORS.length].bg;
      const el = document.getElementById('winnerDisplay');
      el.textContent = winner;
      el.style.color = winColor;
      document.getElementById('winnerSub').textContent = '🎉 Spin again to pick another';
    }
  }
  requestAnimationFrame(frame);
}

// Touch + click on canvas
canvas.addEventListener('click', () => { if (!spinning) spin(); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); if (!spinning) spin(); }, {passive: false});

// Enter key in textarea
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) addNames();
});

load();

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../sw.js').catch(() => {});
}
</script>
