function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function pickName() {
  const region = document.getElementById('region').value;
  const gender = document.getElementById('gender').value;
  const d = DATA[region];
  const g = gender === 'any' ? (Math.random() < 0.5 ? 'male' : 'female') : gender;
  const first = rand(d[g]);
  const last = rand(d.last);
  return `${first} ${last}`;
}

function generate() {
  const out = document.getElementById('namesOutput');
  const copyAllBtn = document.getElementById('copyAllBtn');
  out.innerHTML = '';
  const names = Array.from({length: count}, () => pickName());
  names.forEach((name, i) => {
    const item = document.createElement('div');
    item.className = 'name-item';
    item.style.animationDelay = (i * 60) + 'ms';
    item.innerHTML = `
      <span class="name-item-text">${escHtml(name)}</span>
      <button class="name-copy-btn" onclick="copyOne(this,'${escAttr(name)}')">copy</button>
    `;
    out.appendChild(item);
  });
  copyAllBtn.style.display = count > 1 ? 'block' : 'none';
  copyAllBtn.dataset.names = names.join('\n');
}

function copyOne(btn, name) {
  navigator.clipboard.writeText(name).then(() => {
    btn.textContent = 'copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1500);
  });
}

function copyAll() {
  const btn = document.getElementById('copyAllBtn');
  navigator.clipboard.writeText(btn.dataset.names).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy all names'; btn.classList.remove('copied'); }, 1500);
  });
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return s.replace(/'/g,"\\'"); }

// Generate on load
generate();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../sw.js').catch(() => {});
}
