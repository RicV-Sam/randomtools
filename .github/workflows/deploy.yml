name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check:learning
      - run: npm run build
      - run: npm run check:content
      - name: Write IndexNow key file
        if: env.INDEXNOW_API_KEY != ''
        run: npm run indexnow:key

      - name: Write deployment marker
        run: printf '%s' "$GITHUB_SHA" > _site/indexnow-revision.txt

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
      BING_SITE_URL: https://spinnit.site
      INDEXNOW_SITE_URL: https://spinnit.site
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Submit URLs to Bing Webmaster
        if: env.BING_WEBMASTER_API_KEY != ''
        run: node scripts/submit-bing.js --sitemap https://spinnit.site/sitemap.xml
      - name: Validate IndexNow change selection
        run: node --test scripts/notify-indexnow.test.mjs

      - name: Notify IndexNow of changed pages
        id: indexnow
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' && env.INDEXNOW_API_KEY != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/notify-indexnow.mjs notify https://spinnit.site

      - name: Record IndexNow outcome
        if: ${{ always() }}
        env:
          SUBMISSION_OUTCOME: ${{ steps.indexnow.outcome }}
        run: node scripts/lib/indexnow-client.mjs finalize spinnit.site "$SUBMISSION_OUTCOME"

      - name: Save IndexNow receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-status
          path: .indexnow-status.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

      - name: Save changed-page state
        if: steps.indexnow.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-state
          path: .indexnow-state/state.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
