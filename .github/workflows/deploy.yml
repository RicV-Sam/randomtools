name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run check:content
      - name: Write IndexNow key file
        if: env.INDEXNOW_API_KEY != ''
        run: npm run indexnow:key

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
      BING_SITE_URL: https://spinnit.site
      INDEXNOW_SITE_URL: https://spinnit.site
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v6
        if: env.BING_WEBMASTER_API_KEY != '' || env.INDEXNOW_API_KEY != ''
      - uses: actions/setup-node@v6
        if: env.BING_WEBMASTER_API_KEY != '' || env.INDEXNOW_API_KEY != ''
        with:
          node-version-file: .nvmrc
      - name: Submit URLs to Bing Webmaster
        if: env.BING_WEBMASTER_API_KEY != ''
        run: node scripts/submit-bing.js --sitemap https://spinnit.site/sitemap.xml
      - name: Submit URLs to IndexNow
        if: env.INDEXNOW_API_KEY != ''
        run: node scripts/submit-indexnow.js --sitemap https://spinnit.site/sitemap.xml
